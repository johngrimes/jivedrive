openapi: 3.0.3
info:
  title: JiveDrive API
  version: 1.3.0
  description: >
    REST API between the JiveDrive SPA and its backend. All file operations
    are scoped to the authenticated user's configured bucket and prefix.
    Authentication is passkey (WebAuthn) only; sessions are opaque tokens in
    an httpOnly cookie.

    v1.3.0 (spec 006-folder-sharing): every /api/files operation accepts an
    explicit `space` identifier - `own` (default; the signed-in user's
    configured bucket and prefix) or `shared:<shareId>` (a folder another
    user shared with the caller; keys are relative to the shared folder,
    and the effective scope is the sharer's bucket plus the shared folder).
    New /api/shares endpoints create, list and revoke persistent
    user-to-user folder grants; new /api/users search lets any signed-in
    user find a recipient by username. User-to-user grants are stored,
    listed back to the owner, and revocable; the fire-and-forget anonymous
    share links (/api/files/share-url) are unchanged. Supersedes the v1.2.0
    copy in .local/specs/archive/005-security-hardening/contracts/openapi.yaml.
servers:
  - url: https://drive.grimes.id.au
security:
  - cookieAuth: []
paths:
  /healthcheck:
    get:
      operationId: healthcheck
      summary: Liveness and readiness probe for Kubernetes.
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /auth/register/options:
    post:
      operationId: registrationOptions
      summary: >
        Start passkey registration for a token: an invite token (new user,
        or re-enrollment after an admin passkey reset) or the bootstrap
        enrollment token (provisioned admin with no passkey yet). A username
        alone is never accepted; responses never reveal account existence
        without a valid token. Registration options request discoverable
        credentials (residentKey required, userVerification required).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: >
                    Invite token from the invite link, or the bootstrap
                    enrollment token (JIVEDRIVE_BOOTSTRAP_ADMIN_ENROLLMENT_TOKEN)
                    for the provisioned admin's first passkey.
      responses:
        "200":
          description: WebAuthn registration options (PublicKeyCredentialCreationOptions).
          content:
            application/json:
              schema:
                type: object
                required: [options, username]
                properties:
                  options: { type: object, description: PublicKeyCredentialCreationOptions. }
                  username: { type: string }
                  bucket: { type: string }
                  prefix: { type: string }
        "400":
          description: >
            Unknown/expired/claimed invite, wrong bootstrap token, or the
            target account already has a discoverable passkey.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited (code rate_limited, Retry-After header).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/register/verify:
    post:
      operationId: registrationVerify
      summary: >
        Verify passkey registration and create the user and session, or
        attach the passkey to an existing account when the invite's
        username already exists (bucket/prefix/isAdmin must match).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, credential]
              properties:
                token:
                  type: string
                  description: Invite token or bootstrap enrollment token from register/options.
                credential:
                  description: WebAuthn credential response from the browser.
                  type: object
      responses:
        "200":
          description: Registration complete; session cookie set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400":
          description: Verification failed, token no longer valid, or attach gate refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/login/options:
    post:
      operationId: loginOptions
      summary: >
        Start a username-less passkey sign-in. Returns assertion options with
        no allowCredentials (discoverable-credential flow) and an opaque
        single-use requestId for the verify step.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        "200":
          description: WebAuthn assertion options (PublicKeyCredentialRequestOptions).
          content:
            application/json:
              schema:
                type: object
                required: [requestId, options]
                properties:
                  requestId: { type: string, description: Opaque single-use id for login/verify. }
                  options: { type: object, description: PublicKeyCredentialRequestOptions. }
        "429":
          description: Rate limited.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/login/verify:
    post:
      operationId: loginVerify
      summary: Verify the passkey assertion and create a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, credential]
              properties:
                requestId: { type: string }
                credential:
                  description: WebAuthn assertion response from the browser.
                  type: object
      responses:
        "200":
          description: Signed in; session cookie set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: Unknown/expired requestId or assertion verification failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session.
      responses:
        "204":
          description: Session ended and cookie cleared.
        "429":
          description: Rate limited.
  /auth/me:
    get:
      operationId: currentUser
      summary: Return the signed-in user, if any.
      responses:
        "200":
          description: Current user (or null when signed out).
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { anyOf: [{ $ref: "#/components/schemas/User" }, { type: "null" }] }
        "429":
          description: Rate limited.
  /api/files:
    get:
      operationId: listFiles
      summary: List folders and files under a prefix within a space.
      parameters:
        - name: space
          in: query
          required: false
          schema:
            type: string
            description: >
              `own` (default) or `shared:<shareId>`. For a shared space the
              prefix is relative to the shared folder and access is granted
              only while the caller is its recipient.
        - name: prefix
          in: query
          required: false
          schema: { type: string, description: Relative subfolder within the space. }
        - name: cursor
          in: query
          required: false
          schema: { type: string, description: Opaque continuation token from a previous page. }
      responses:
        "200":
          description: One page of folders and files.
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders: { type: array, items: { type: string }, description: Common prefix names. }
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileEntry"
                  nextCursor: { type: string, nullable: true }
        "401":
          description: Not signed in.
        "404":
          description: Unknown share, or the share no longer exists (revoked).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited.
    delete:
      operationId: deleteFile
      summary: Permanently delete one object within a space.
      parameters:
        - name: space
          in: query
          required: false
          schema:
            type: string
            description: `own` (default) or `shared:<shareId>`; see listFiles.
        - name: key
          in: query
          required: true
          schema: { type: string, description: Object key relative to the space (scoped and validated server-side). }
      responses:
        "204":
          description: Object deleted.
        "404":
          description: Object does not exist, or the shared space is unknown/revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: Key falls outside the space's scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited.
  /api/files/download-url:
    get:
      operationId: downloadUrl
      summary: Presigned GET URL that downloads one file to the user's machine.
      parameters:
        - name: space
          in: query
          required: false
          schema:
            type: string
            description: `own` (default) or `shared:<shareId>`; see listFiles.
        - name: key
          in: query
          required: true
          schema: { type: string, description: Object key relative to the space. }
      responses:
        "200":
          description: Presigned GET URL (short-lived).
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        "400":
          description: Key falls outside the space's scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown or revoked shared space.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited.
  /api/files/upload-url:
    post:
      operationId: uploadUrl
      summary: Obtain a presigned PUT URL to upload a file into a space.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder, fileName, overwrite]
              properties:
                space:
                  type: string
                  description: `own` (default) or `shared:<shareId>`; see listFiles.
                folder: { type: string, description: Destination folder relative to the space. }
                fileName: { type: string, description: Base file name, stored verbatim. }
                overwrite:
                  type: boolean
                  description: Must be true when the key already exists, otherwise 409.
      responses:
        "200":
          description: Presigned PUT URL for the browser to upload to directly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  key: { type: string }
        "409":
          description: Object already exists and overwrite was not requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown or revoked shared space.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited.
  /api/files/share-url:
    post:
      operationId: shareUrl
      summary: >
        Presigned GET URL for sharing a file, expiring after the chosen
        period. Fire-and-forget: generated, displayed, never stored or
        revoked. Valid in any space the caller can access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                space:
                  type: string
                  description: `own` (default) or `shared:<shareId>`; see listFiles.
                key: { type: string, description: Object key relative to the space. }
                expiresIn:
                  type: string
                  enum: [1h, 24h, 7d, 30d]
                  default: 7d
      responses:
        "200":
          description: Presigned GET URL with the requested expiry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "400":
          description: Key falls outside the space's scope, or invalid expiry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown or revoked shared space.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited.
  /api/shares:
    get:
      operationId: listShares
      summary: >
        List the signed-in user's shares in both directions: folders shared
        with them (incoming, feeds the root mounts) and folders they share
        with others (outgoing, feeds the share dialogs).
      responses:
        "200":
          description: Incoming and outgoing shares.
          content:
            application/json:
              schema:
                type: object
                required: [incoming, outgoing]
                properties:
                  incoming:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShareIncoming"
                  outgoing:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShareOutgoing"
        "429":
          description: Rate limited.
    post:
      operationId: createShare
      summary: >
        Share one of the caller's subfolders with another user. The
        recipient gains full read/write access (browse, download, upload,
        overwrite, delete) until the owner revokes. The space root cannot
        be shared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder, recipientUsername]
              properties:
                folder:
                  type: string
                  description: Relative subfolder of the caller's space (no leading slash, no .. segments).
                recipientUsername:
                  type: string
                  description: Username of the recipient, from /api/users search.
      responses:
        "201":
          description: Share created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  share: { $ref: "#/components/schemas/ShareOutgoing" }
        "400":
          description: >
            Folder is the root, unsafe, or invalid; recipient is the caller
            (code cannot_share_with_self); recipient unknown (code
            user_not_found).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Folder already shared with that recipient (code already_shared).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited.
  /api/shares/{id}:
    delete:
      operationId: revokeShare
      summary: >
        Revoke a share (owner only). The record is deleted; the recipient
        loses access on their next request. Unknown or foreign share ids
        return 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Share revoked.
        "404":
          description: Unknown share, or not the owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited.
  /api/users:
    get:
      operationId: searchUsers
      summary: >
        Search signed-in users by username (case-insensitive substring) to
        pick a share recipient. Excludes the caller; returns identity only
        - never bucket, prefix, or admin status. At most 20 results.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, description: Username substring; empty returns nothing. }
      responses:
        "200":
          description: Matching users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSummary"
        "429":
          description: Rate limited.
  /api/admin/users:
    get:
      operationId: listUsers
      summary: List all users (admin only).
      responses:
        "200":
          description: User list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/User" } }
        "403":
          description: Not an admin.
    delete:
      operationId: removeUser
      summary: >
        Remove a user account (storage objects untouched). Their outgoing
        and incoming shares are removed with the account (cascade).
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: User removed.
        "400":
          description: Cannot remove the last admin or yourself.
        "403":
          description: Not an admin.
  /api/admin/users/{id}/passkeys:
    delete:
      operationId: resetUserPasskeys
      summary: >
        Reset a user's passkeys (admin only): delete every credential row,
        revoke ALL of the user's sessions (including the caller's own when
        resetting self), cancel pending invites for the username, and create
        a fresh 48-hour re-enrollment invite. The account and storage objects
        are untouched. Returns the re-enrollment invite link.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Passkeys deleted; sessions revoked; re-enrollment invite created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite: { $ref: "#/components/schemas/Invite" }
                  link: { type: string, description: Full registration URL containing the fresh token. }
        "404":
          description: Unknown user.
        "403":
          description: Not an admin.
  /api/admin/invites:
    get:
      operationId: listInvites
      summary: List pending and claimed invites (admin only).
      responses:
        "200":
          description: Invite list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites: { type: array, items: { $ref: "#/components/schemas/Invite" } }
        "403":
          description: Not an admin.
    post:
      operationId: createInvite
      summary: Create an invite with a 48-hour expiry (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, bucket, prefix]
              properties:
                username: { type: string }
                bucket: { type: string }
                prefix: { type: string }
                isAdmin: { type: boolean, default: false }
      responses:
        "201":
          description: Invite created; link shown to the admin.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite: { $ref: "#/components/schemas/Invite" }
                  link: { type: string, description: Full registration URL containing the token. }
        "409":
          description: Username already taken or a pending invite already exists.
        "403":
          description: Not an admin.
  /api/admin/invites/{id}/resend:
    post:
      operationId: resendInvite
      summary: Create a fresh token for an expired invite (admin only).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: New invite link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite: { $ref: "#/components/schemas/Invite" }
                  link: { type: string }
        "404":
          description: Invite not found or already claimed.
        "403":
          description: Not an admin.
  /api/admin/invites/{id}:
    delete:
      operationId: cancelInvite
      summary: Cancel a pending invite (admin only).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Invite cancelled.
        "403":
          description: Not an admin.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: jivedrive_session
  schemas:
    User:
      type: object
      required: [id, username, bucket, prefix, isAdmin]
      properties:
        id: { type: string }
        username: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        isAdmin: { type: boolean }
    UserSummary:
      type: object
      required: [id, username]
      description: Identity-only view of a user, for the share recipient picker.
      properties:
        id: { type: string }
        username: { type: string }
    ShareIncoming:
      type: object
      required: [id, folder, folderName, sharer]
      description: A folder another user shared with the caller.
      properties:
        id: { type: string }
        folder: { type: string, description: Shared folder relative to the sharer's space. }
        folderName: { type: string, description: Base name of the shared folder, shown as the mount. }
        sharer: { $ref: "#/components/schemas/UserSummary" }
    ShareOutgoing:
      type: object
      required: [id, folder, folderName, recipient, createdAt]
      description: A folder the caller shares with another user.
      properties:
        id: { type: string }
        folder: { type: string, description: Shared folder relative to the caller's space. }
        folderName: { type: string, description: Base name of the shared folder. }
        recipient: { $ref: "#/components/schemas/UserSummary" }
        createdAt: { type: string, format: date-time }
    FileEntry:
      type: object
      required: [key, name, size, lastModified]
      properties:
        key: { type: string, description: Object key relative to the listed space. }
        name: { type: string, description: Base name of the object. }
        size: { type: integer, format: int64 }
        lastModified: { type: string, format: date-time }
    Invite:
      type: object
      required: [id, username, bucket, prefix, isAdmin, expiresAt, status]
      properties:
        id: { type: string }
        username: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        isAdmin: { type: boolean }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, claimed, expired] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Human-readable message. }
        code: { type: string, description: Machine-readable error code. }
