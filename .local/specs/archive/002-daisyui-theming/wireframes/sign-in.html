<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe - Sign in</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f0f0;
      color: #333;
      line-height: 1.4;
    }
    .wf-container { max-width: 1200px; margin: 0 auto; background: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    .wf-header { background: #e8e8e8; border-bottom: 2px solid #bbb; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .wf-logo { font-weight: bold; font-size: 1.2rem; color: #666; }
    .wf-nav { display: flex; gap: 1.5rem; align-items: center; }
    .wf-nav a { color: #555; text-decoration: none; font-size: 0.9rem; }
    .wf-nav a:hover { text-decoration: underline; }
    .wf-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .wf-auth-card { width: 100%; max-width: 420px; background: #fafafa; border: 2px solid #ccc; border-radius: 6px; padding: 1.75rem; }
    .wf-auth-title { font-size: 1.3rem; font-weight: 600; color: #444; margin-bottom: 0.25rem; }
    .wf-auth-sub { font-size: 0.9rem; color: #888; margin-bottom: 1.25rem; }
    .wf-form-group { margin-bottom: 1rem; }
    .wf-label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 0.25rem; }
    .wf-input { width: 100%; padding: 0.6rem; border: 2px solid #bbb; border-radius: 4px; background: #fff; font-size: 0.9rem; color: #555; }
    .wf-button { display: block; width: 100%; padding: 0.6rem 1rem; background: #ddd; border: 2px solid #aaa; border-radius: 4px; color: #555; font-size: 0.95rem; font-weight: 600; text-decoration: none; text-align: center; cursor: pointer; margin-top: 0.5rem; }
    .wf-button:hover { background: #d0d0d0; }
    .wf-alert { border: 2px solid #b0b0b0; background: #ececec; color: #666; border-radius: 4px; padding: 0.6rem 0.75rem; font-size: 0.85rem; margin-bottom: 1rem; }
    .wf-footer-link { text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: #888; }
    .wf-footer-link a { color: #555; }
    .wf-annotation { font-size: 0.8rem; color: #999; font-style: italic; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="wf-container">
    <header class="wf-header">
      <div class="wf-logo">JiveDrive</div>
      <nav class="wf-nav">
        <span style="color:#888; font-size:0.85rem;">Signed out</span>
        <a href="./sign-in.html">Sign in</a>
      </nav>
    </header>

    <div class="wf-body">
      <div class="wf-auth-card">
        <h1 class="wf-auth-title">Sign in</h1>
        <p class="wf-auth-sub">Passkeys only - no password.</p>

        <div class="wf-form-group">
          <label class="wf-label" for="username">Username</label>
          <input class="wf-input" id="username" type="text" placeholder="alex">
        </div>

        <div class="wf-alert">No passkey found for this username. Try again or register.</div>

        <a href="./files.html" class="wf-button">Continue with passkey</a>

        <p class="wf-footer-link">New here? <a href="./register.html">Register</a></p>
        <p class="wf-annotation">Light mode: corporate theme. Dark mode: business theme. Follows system preference automatically.</p>
      </div>
    </div>
  </div>
</body>
</html>
