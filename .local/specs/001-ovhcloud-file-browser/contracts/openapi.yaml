openapi: 3.0.3
info:
  title: JiveDrive API
  version: 1.0.0
  description: >
    REST API between the JiveDrive SPA and its backend. All file operations
    are scoped to the authenticated user's configured bucket and prefix.
    Authentication is passkey (WebAuthn) only; sessions are opaque tokens in
    an httpOnly cookie.
servers:
  - url: https://drive.grimes.id.au
security:
  - cookieAuth: []
paths:
  /healthcheck:
    get:
      operationId: healthcheck
      summary: Liveness and readiness probe for Kubernetes.
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /auth/register/options:
    post:
      operationId: registrationOptions
      summary: Start passkey registration for an invite token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: Invite token from the invite link. }
      responses:
        "200":
          description: WebAuthn registration options (PublicKeyCredentialCreationOptions).
          content:
            application/json: {}
        "400":
          description: Invite expired, already claimed, or cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/register/verify:
    post:
      operationId: registrationVerify
      summary: Verify passkey registration and create the user and session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, credential]
              properties:
                token: { type: string }
                credential:
                  description: WebAuthn credential response from the browser.
                  type: object
      responses:
        "200":
          description: Registration complete; session cookie set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400":
          description: Verification failed or invite no longer valid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/login/options:
    post:
      operationId: loginOptions
      summary: Start a passkey sign-in for a username.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        "200":
          description: WebAuthn assertion options (PublicKeyCredentialRequestOptions).
          content:
            application/json: {}
        "404":
          description: Unknown username.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/login/verify:
    post:
      operationId: loginVerify
      summary: Verify the passkey assertion and create a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, credential]
              properties:
                username: { type: string }
                credential:
                  description: WebAuthn assertion response from the browser.
                  type: object
      responses:
        "200":
          description: Signed in; session cookie set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: Assertion verification failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session.
      responses:
        "204":
          description: Session ended and cookie cleared.
  /auth/me:
    get:
      operationId: currentUser
      summary: Return the signed-in user, if any.
      responses:
        "200":
          description: Current user (or null when signed out).
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { anyOf: [{ $ref: "#/components/schemas/User" }, { type: "null" }] }
  /api/files:
    get:
      operationId: listFiles
      summary: List folders and files under a prefix within the user's space.
      parameters:
        - name: prefix
          in: query
          required: false
          schema: { type: string, description: Relative subfolder within the user's prefix. }
        - name: cursor
          in: query
          required: false
          schema: { type: string, description: Opaque continuation token from a previous page. }
      responses:
        "200":
          description: One page of folders and files.
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders: { type: array, items: { type: string }, description: Common prefix names. }
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileEntry"
                  nextCursor: { type: string, nullable: true }
        "401":
          description: Not signed in.
    delete:
      operationId: deleteFile
      summary: Permanently delete one object within the user's space.
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string, description: Full object key (scoped and validated server-side). }
      responses:
        "204":
          description: Object deleted.
        "404":
          description: Object does not exist.
        "400":
          description: Key falls outside the user's prefix.
  /api/files/upload-url:
    post:
      operationId: uploadUrl
      summary: Obtain a presigned PUT URL to upload a file into the user's space.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder, fileName, overwrite]
              properties:
                folder: { type: string, description: Destination folder relative to the user's prefix. }
                fileName: { type: string, description: Base file name, stored verbatim. }
                overwrite:
                  type: boolean
                  description: Must be true when the key already exists, otherwise 409.
      responses:
        "200":
          description: Presigned PUT URL for the browser to upload to directly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  key: { type: string }
        "409":
          description: Object already exists and overwrite was not requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/files/download-url:
    get:
      operationId: downloadUrl
      summary: Presigned GET URL that downloads one file to the user's machine.
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Presigned GET URL (short-lived).
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
  /api/files/share-url:
    post:
      operationId: shareUrl
      summary: Presigned GET URL for sharing a file, expiring after the chosen period.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string }
                expiresIn:
                  type: string
                  enum: [1h, 24h, 7d, 30d]
                  default: 7d
      responses:
        "200":
          description: Presigned GET URL with the requested expiry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
  /api/admin/users:
    get:
      operationId: listUsers
      summary: List all users (admin only).
      responses:
        "200":
          description: User list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/User" } }
        "403":
          description: Not an admin.
    delete:
      operationId: removeUser
      summary: Remove a user account (storage objects untouched).
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: User removed.
        "400":
          description: Cannot remove the last admin or yourself.
        "403":
          description: Not an admin.
  /api/admin/invites:
    get:
      operationId: listInvites
      summary: List pending and claimed invites (admin only).
      responses:
        "200":
          description: Invite list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites: { type: array, items: { $ref: "#/components/schemas/Invite" } }
        "403":
          description: Not an admin.
    post:
      operationId: createInvite
      summary: Create an invite with a 48-hour expiry (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, bucket, prefix]
              properties:
                username: { type: string }
                bucket: { type: string }
                prefix: { type: string }
                isAdmin: { type: boolean, default: false }
      responses:
        "201":
          description: Invite created; link shown to the admin.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite: { $ref: "#/components/schemas/Invite" }
                  link: { type: string, description: Full registration URL containing the token. }
        "409":
          description: Username already taken.
        "403":
          description: Not an admin.
  /api/admin/invites/{id}/resend:
    post:
      operationId: resendInvite
      summary: Create a fresh token for an expired invite (admin only).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: New invite link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite: { $ref: "#/components/schemas/Invite" }
                  link: { type: string }
        "404":
          description: Invite not found or already claimed.
        "403":
          description: Not an admin.
  /api/admin/invites/{id}:
    delete:
      operationId: cancelInvite
      summary: Cancel a pending invite (admin only).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Invite cancelled.
        "403":
          description: Not an admin.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: jivedrive_session
  schemas:
    User:
      type: object
      required: [id, username, bucket, prefix, isAdmin]
      properties:
        id: { type: string }
        username: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        isAdmin: { type: boolean }
    FileEntry:
      type: object
      required: [key, name, size, lastModified]
      properties:
        key: { type: string, description: Full object key within the user's space. }
        name: { type: string, description: Base name of the object. }
        size: { type: integer, format: int64 }
        lastModified: { type: string, format: date-time }
    Invite:
      type: object
      required: [id, username, bucket, prefix, isAdmin, expiresAt, status]
      properties:
        id: { type: string }
        username: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        isAdmin: { type: boolean }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, claimed, expired] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Human-readable message. }
        code: { type: string, description: Machine-readable error code. }
