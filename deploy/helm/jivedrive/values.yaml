# Default values for the jivedrive chart.
# This is a YAML-formatted file. See the chart README for full documentation
# of every value; inline comments here are kept minimal.

jivedrive:
  # Container image for the JiveDrive server, built from docker/Dockerfile.
  # The image is not published yet: build and push it before deploying, or
  # point these values at your registry (see the chart README).
  image:
    repository: "ghcr.io/johngrimes/jivedrive"
    tag: "0.1.0"
    pullPolicy: "Always"
    # Name of an existing kubernetes.io/dockerconfigjson Secret used to pull
    # the image from a private registry. Empty = no imagePullSecrets.
    pullSecret: ""

  # Number of replicas. JiveDrive is SQLite-backed and single-writer: keep
  # this at 1.
  replicas: 1

  # Resource requests and limits for the server container. The memory
  # limit must cover the search scan's weighted download budget (5x the
  # extraction cap of charged in-flight bytes) plus the app baseline;
  # 512Mi OOM-killed the first full index of a large space. Tune per
  # deployment.
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  # Pod scheduling. All optional, all unset by default.
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Non-sensitive environment variables for the server, passed via a
  # ConfigMap. Defaults match the backend's own defaults, except the
  # WebAuthn and S3 values which default to the production deployment
  # (drive.grimes.id.au, OVHcloud SGP). See the chart README for the full
  # list of JIVEDRIVE_* variables.
  config:
    JIVEDRIVE_PORT: "3000"
    # The database file lives on the volume mounted at
    # jivedrive.persistence.mountPath; keep this path under that mount.
    JIVEDRIVE_DB_PATH: "/data/jivedrive.db"
    # Migrations are baked into the image at /app/migrations.
    JIVEDRIVE_MIGRATIONS_DIR: "/app/migrations"
    JIVEDRIVE_SESSION_TTL_DAYS: "30"
    # Sessions also expire after this many days of inactivity (rolling).
    JIVEDRIVE_SESSION_IDLE_DAYS: "7"
    # Token-bucket rate limits: /auth/* allows authPerMinute per minute with
    # a burst of authBurst; /api/files/* likewise with files*.
    JIVEDRIVE_RATE_LIMIT_AUTH_PER_MINUTE: "20"
    JIVEDRIVE_RATE_LIMIT_AUTH_BURST: "10"
    JIVEDRIVE_RATE_LIMIT_FILES_PER_MINUTE: "300"
    JIVEDRIVE_RATE_LIMIT_FILES_BURST: "100"
    # Background search indexing: seconds between per-user space scans and
    # the maximum object size (bytes) eligible for content extraction.
    JIVEDRIVE_SEARCH_SCAN_INTERVAL_SECONDS: "3600"
    JIVEDRIVE_SEARCH_INDEX_MAX_BYTES: "10485760"
    # TLS is terminated in front of the service, which sets X-Forwarded-For;
    # trusting it lets the rate limiter key on the real client address.
    JIVEDRIVE_TRUST_PROXY: "true"
    JIVEDRIVE_S3_ENDPOINT: "https://s3.sgp.io.cloud.ovh.net"
    JIVEDRIVE_S3_REGION: "sgp"
    JIVEDRIVE_WEBAUTHN_RP_ID: "drive.grimes.id.au"
    JIVEDRIVE_WEBAUTHN_ORIGIN: "https://drive.grimes.id.au"
    # Optional bootstrap admin provisioned at first start. Unset by default;
    # to provision one, uncomment and set these (the enrollment token below
    # is REQUIRED whenever the username is set - see the chart README):
    # JIVEDRIVE_BOOTSTRAP_ADMIN_USERNAME: "admin"
    # JIVEDRIVE_BOOTSTRAP_ADMIN_BUCKET: "jivedrive-prod"
    # JIVEDRIVE_BOOTSTRAP_ADMIN_PREFIX: "users/admin/"
    # JIVEDRIVE_BOOTSTRAP_ADMIN_IS_ADMIN: "true"
    # JIVEDRIVE_BOOTSTRAP_ADMIN_ENROLLMENT_TOKEN: ""

  # Sensitive environment variables for the server, stored in a Kubernetes
  # Secret. The app refuses to start without S3 credentials, so set both
  # keys at install time (see the chart README).
  secretConfig:
    JIVEDRIVE_S3_ACCESS_KEY_ID: ""
    JIVEDRIVE_S3_SECRET_ACCESS_KEY: ""
    # The bootstrap enrollment token is a secret: set it here (or with
    # --set) instead of in jivedrive.config. REQUIRED (≥16 chars) whenever
    # JIVEDRIVE_BOOTSTRAP_ADMIN_USERNAME is set; see the chart README.
    # JIVEDRIVE_BOOTSTRAP_ADMIN_ENROLLMENT_TOKEN: ""

  # Kubernetes Service in front of the server. No Ingress is created by
  # this chart: expose the service with your own Ingress, a LoadBalancer,
  # or a port-forward.
  service:
    type: "ClusterIP"
    port: 80

  # Ingress for external access. Disabled by default; enable and set the
  # host/TLS per environment (see values-ci.yaml).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # hosts:
    #   - host: drive.grimes.id.au
    #     paths:
    #       - path: /
    #         pathType: Prefix
    # tls:
    #   - secretName: jivedrive-tls
    #     hosts:
    #       - drive.grimes.id.au
    hosts: []
    tls: []

  # Persistent storage for the SQLite database. Disabled by default: the
  # chart then mounts an emptyDir at mountPath, so the database is
  # ephemeral and lost when the pod is recreated. Enable for production.
  persistence:
    enabled: false
    # 1Gi filled up partway through the first full search index of a
    # large space (~21 KiB of database per indexed document).
    size: "5Gi"
    mountPath: "/data"
    # storageClassName: ""  # set when your cluster requires a specific class
