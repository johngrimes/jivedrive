# Default values for the jivedrive chart.
# This is a YAML-formatted file. See the chart README for full documentation
# of every value; inline comments here are kept minimal.

jivedrive:
  # Container image for the JiveDrive server, built from docker/Dockerfile.
  # The image is not published yet: build and push it before deploying, or
  # point these values at your registry (see the chart README).
  image:
    repository: "ghcr.io/johngrimes/jivedrive"
    tag: "0.1.0"
    pullPolicy: "Always"

  # Number of replicas. JiveDrive is SQLite-backed and single-writer: keep
  # this at 1.
  replicas: 1

  # Resource requests and limits for the server container. Unset by default;
  # Kubernetes then schedules the pod with no requests or limits.
  resources:
    {}
    # requests:
    #   memory: "256Mi"
    #   cpu: "100m"
    # limits:
    #   memory: "512Mi"
    #   cpu: "500m"

  # Pod scheduling. All optional, all unset by default.
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Non-sensitive environment variables for the server, passed via a
  # ConfigMap. Defaults match the backend's own defaults, except the
  # WebAuthn and S3 values which default to the production deployment
  # (drive.grimes.id.au, OVHcloud GRA). See the chart README for the full
  # list of JIVEDRIVE_* variables.
  config:
    JIVEDRIVE_PORT: "3000"
    # The database file lives on the volume mounted at
    # jivedrive.persistence.mountPath; keep this path under that mount.
    JIVEDRIVE_DB_PATH: "/data/jivedrive.db"
    # Migrations are baked into the image at /app/migrations.
    JIVEDRIVE_MIGRATIONS_DIR: "/app/migrations"
    JIVEDRIVE_SESSION_TTL_DAYS: "30"
    JIVEDRIVE_S3_ENDPOINT: "https://s3.gra.io.cloud.ovh.net"
    JIVEDRIVE_S3_REGION: "gra"
    JIVEDRIVE_WEBAUTHN_RP_ID: "drive.grimes.id.au"
    JIVEDRIVE_WEBAUTHN_ORIGIN: "https://drive.grimes.id.au"
    # Optional bootstrap admin provisioned at first start. Unset by default;
    # to provision one, uncomment and set these:
    # JIVEDRIVE_BOOTSTRAP_ADMIN_USERNAME: "admin"
    # JIVEDRIVE_BOOTSTRAP_ADMIN_BUCKET: "jivedrive-prod"
    # JIVEDRIVE_BOOTSTRAP_ADMIN_PREFIX: "users/admin/"
    # JIVEDRIVE_BOOTSTRAP_ADMIN_IS_ADMIN: "true"

  # Sensitive environment variables for the server, stored in a Kubernetes
  # Secret. The app refuses to start without S3 credentials, so set both
  # keys at install time (see the chart README).
  secretConfig:
    JIVEDRIVE_S3_ACCESS_KEY_ID: ""
    JIVEDRIVE_S3_SECRET_ACCESS_KEY: ""

  # Kubernetes Service in front of the server. No Ingress is created by
  # this chart: expose the service with your own Ingress, a LoadBalancer,
  # or a port-forward.
  service:
    type: "ClusterIP"
    port: 80

  # Persistent storage for the SQLite database. Disabled by default: the
  # chart then mounts an emptyDir at mountPath, so the database is
  # ephemeral and lost when the pod is recreated. Enable for production.
  persistence:
    enabled: false
    size: "1Gi"
    mountPath: "/data"
    # storageClassName: ""  # set when your cluster requires a specific class
