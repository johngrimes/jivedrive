{{- if gt (len .Values.jivedrive.config) 0 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-configmap
  labels:
    {{- include "jivedrive.labels" . | nindent 4 }}
data:
  {{- range $configKey, $configValue := .Values.jivedrive.config }}
  {{ $configKey }}: {{ $configValue | quote }}
  {{- end }}
{{- end }}
