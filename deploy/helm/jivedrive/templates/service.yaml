apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  labels:
    {{- include "jivedrive.labels" . | nindent 4 }}
spec:
  type: {{ .Values.jivedrive.service.type | quote }}
  selector:
    app.kubernetes.io/name: jivedrive
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.jivedrive.service.port }}
      targetPort: http
      protocol: TCP
