{{- if gt (len .Values.jivedrive.secretConfig) 0 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    {{- include "jivedrive.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $configKey, $configValue := .Values.jivedrive.secretConfig }}
  {{ $configKey }}: {{ $configValue | quote }}
  {{- end }}
{{- end }}
