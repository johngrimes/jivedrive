name: Quality and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Matches the runtime image (docker/Dockerfile).
          bun-version: "1.3.14"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Production SPA build - the same command the Dockerfile runs. Catches
      # frontend build breakage before the image is built.
      - run: bun run --cwd frontend build

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium --with-deps

      # The playwright config boots its own server (built SPA + e2eServer on
      # 5173 with a seeded in-memory database); no dev-server setup needed.
      - run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-build:
    name: Build and push Docker image
    needs: [static-analysis, unit-tests, build, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Minikube
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # Repository secrets required by this job:
    #   TS_OAUTH_CLIENT_ID / TS_OAUTH_CLIENT_SECRET - Tailscale OAuth client
    #     (tag:ci) with access to the minikube host
    #   K8S_SERVER / K8S_CA_CERT / K8S_TOKEN         - kubeconfig for the
    #     minikube cluster (server URL, base64 CA or raw PEM, single-line
    #     service-account token)
    #   JIVEDRIVE_S3_ACCESS_KEY_ID / JIVEDRIVE_S3_SECRET_ACCESS_KEY - S3
    #     credentials; the app refuses to start without them
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Install Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          # K8S_CA_CERT is accepted as single-line base64 (kubeconfig
          # certificate-authority-data) or as raw PEM: strip whitespace, then
          # re-encode if the result is not already valid base64. A raw PEM
          # pasted verbatim would otherwise break the YAML with newlines.
          CA_RAW=$(printf '%s' "$K8S_CA_CERT" | tr -d '[:space:]')
          if [ -n "$CA_RAW" ] && printf '%s' "$CA_RAW" | base64 -d >/dev/null 2>&1; then
            CA_DATA="$CA_RAW"
          else
            CA_DATA=$(printf '%s' "$CA_RAW" | base64 -w0)
          fi
          # The decoded CA must be a PEM certificate: kubectl fails with a
          # confusing "unable to parse bytes as PEM block" otherwise. Print
          # the first decoded line so a wrong paste (key, kubeconfig, token)
          # is identifiable.
          DECODED=$(printf '%s' "$CA_DATA" | base64 -d 2>/dev/null || true)
          case "$DECODED" in
            *"-----BEGIN CERTIFICATE-----"*) ;;
            *)
              echo "K8S_CA_CERT does not decode to a PEM certificate; first decoded line: $(printf '%s' "$DECODED" | head -n1)" >&2
              exit 1
              ;;
          esac
          # Single-line enforcement: embedded newlines in either value break
          # the YAML with a confusing parse error, so fail fast instead.
          case "$K8S_SERVER" in
            https://*) ;;
            *)
              echo "K8S_SERVER must be a single-line https:// URL" >&2
              exit 1
              ;;
          esac
          case "$K8S_TOKEN" in
            *$'\n'*)
              echo "K8S_TOKEN must be a single line (no newlines); re-paste the token" >&2
              exit 1
              ;;
          esac
          cat > ~/.kube/config <<EOF
          apiVersion: v1
          kind: Config
          current-context: ci
          contexts:
          - context:
              cluster: jivedrive
              user: ci
            name: ci
          clusters:
          - cluster:
              server: $K8S_SERVER
              certificate-authority-data: $CA_DATA
            name: jivedrive
          users:
          - name: ci
            user:
              token: $K8S_TOKEN
          EOF
        env:
          K8S_SERVER: ${{ secrets.K8S_SERVER }}
          K8S_CA_CERT: ${{ secrets.K8S_CA_CERT }}
          K8S_TOKEN: ${{ secrets.K8S_TOKEN }}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Wait for Tailscale connectivity
        run: |
          echo "--- tailscale status ---"
          tailscale status
          for i in $(seq 1 30); do
            if kubectl cluster-info >/tmp/kube-info.log 2>&1; then
              echo "Cluster reachable"
              exit 0
            fi
            echo "Attempt $i/30 - waiting for cluster..."
            sleep 2
          done
          echo "--- last kubectl error ---"
          cat /tmp/kube-info.log
          echo "Cluster not reachable after 60s"
          exit 1

      - name: Deploy with Helm
        run: |
          helm upgrade --install jivedrive deploy/helm/jivedrive -n jivedrive \
            --create-namespace \
            -f deploy/helm/jivedrive/values-ci.yaml \
            --set jivedrive.image.tag=${{ steps.tag.outputs.sha }} \
            --set jivedrive.secretConfig.JIVEDRIVE_S3_ACCESS_KEY_ID='${{ secrets.JIVEDRIVE_S3_ACCESS_KEY_ID }}' \
            --set jivedrive.secretConfig.JIVEDRIVE_S3_SECRET_ACCESS_KEY='${{ secrets.JIVEDRIVE_S3_SECRET_ACCESS_KEY }}'

      - name: Verify rollout
        run: kubectl rollout status deployment/jivedrive-deployment -n jivedrive --timeout=120s
